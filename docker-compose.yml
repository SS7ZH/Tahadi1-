# Local development only. In production the database is Supabase, the API runs on Render and the UI on Vercel.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tahadi
      POSTGRES_PASSWORD: tahadi
      POSTGRES_DB: tahadi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tahadi -d tahadi"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://tahadi:tahadi@db:5432/tahadi
      JWT_SECRET: local-dev-access-secret
      JWT_REFRESH_SECRET: local-dev-refresh-secret
      CORS_ORIGINS: http://localhost:5173
      SEED_ADMIN_EMAIL: admin@tahadi.app
      SEED_ADMIN_PASSWORD: Admin@12345
      SEED_DEMO_PASSWORD: Demo@12345
    # migrate → seed once (skips when data exists) → serve with reload
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
