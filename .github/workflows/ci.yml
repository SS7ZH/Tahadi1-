name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (production Docker image, real PDF rendering)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same image Render deploys (root Dockerfile): Python 3.12 + Pango/HarfBuzz for WeasyPrint.
      - name: Build image
        run: docker build -t tahadi-api .

      - name: Run tests inside the image
        run: |
          mkdir -p pdf-samples
          docker run --rm \
            -e PDF_SAMPLES_DIR=/out \
            -v "$PWD/pdf-samples:/out" \
            tahadi-api python -m pytest -q -rs

      - name: Upload sample PDFs (Arabic + English)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-samples
          path: pdf-samples/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api/v1
