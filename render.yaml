# Render blueprint: FastAPI backend. The database is Supabase (not a Render database).
services:
  - type: web
    name: tahadi-api
    # Docker (not the native Python runtime): the image installs Pango for WeasyPrint PDF export.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Supabase TRANSACTION pooler URL (port 6543), with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Supabase SESSION pooler (or direct) URL (port 5432), with ?sslmode=require, used by alembic
      - key: MIGRATIONS_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # e.g. https://tahadi.vercel.app,http://localhost:5173
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://tahadi-.*\.vercel\.app
      # Only needed for the one-time `python -m app.db.seed` run from the Render shell
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Private bucket for medical reports
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: medical-files
