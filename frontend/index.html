<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2550D" />
    <meta name="description" content="تحدي: منصة تدريب لتسجيل القياسات وبرامج التدريب والتغذية ومتابعة التقدم مع مدربك. Tahadi: coaching platform for measurements, training programs, nutrition and progress tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="تحدي · Tahadi" />
    <meta property="og:title" content="تحدي · Tahadi" />
    <meta property="og:description" content="قياسات، برامج تدريب، سعرات وعناصر غذائية، وتقارير PDF مع مدربك. Measurements, training programs, nutrition and PDF reports with your coach." />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>تحدي</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('tahadi-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (localStorage.getItem('tahadi-lang') === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
